server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 1000

spring:
  application:
    name: shortlink
  task:
    scheduling:
      # 默认只有 1 个线程。我们有四个定时任务（布隆落盘、过期回收、统计聚合、缓存统计），
      # 聚合任务一轮要跑上万条 UPDATE，会把唯一那条线程占死——其余任务全部饿死。
      pool:
        size: 4
      thread-name-prefix: sched-
  datasource:
    url: jdbc:mysql://localhost:3306/shortlink?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: shortlink
    password: shortlink
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      # 默认 30000ms。MySQL 挂掉且缓存未命中时，每个请求会在这里干等 30 秒——
      # 和 Lettuce 那个"重连黑洞"是同一类问题：客户端默认值从不考虑你的延迟目标。
      connection-timeout: 1000
      validation-timeout: 500
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
      connect-timeout: 500ms

shortlink:
  base-url: http://localhost:8080
  code:
    length: 7
    # 7 位码在 1000 万存量下碰撞率 2.8e-6，3 次重试的失败概率约 2e-17
    max-attempts: 3
  cache:
    # D2② L1 条数上限。每条约 400-600B，30 万条约 120-180MB
    local-max-entries: 300000
    local-ttl-seconds: 300
    # L2 TTL 上限，实际取 min(该值, 剩余有效期)
    remote-ttl-seconds: 3600
  bloom:
    # 必须是 2 的幂。1<<27 = 134,217,728 bit = 16MB，
    # 1000 万条 + 7 次哈希的误判率约 0.18%（比预算的 12MB/1% 更宽裕）
    bits: 134217728
    hashes: 7
    path: data/bloom.bin
    # 快照间隔。决定了重启时增量补齐最多要扫多少（= 这几分钟的新建量）
    dump-interval-ms: 300000
  negative:
    # 只承接布隆 1% 的误判，不需要大
    max-entries: 200000
    ttl-seconds: 30
  rate-limit:
    # 正常人点击远到不了 200/秒；500 人共用出口 IP 的公司峰值也就几十/秒
    per-ip-per-second: 200
    # 必须高于设计峰值 5000，否则正常峰值波动就会触发、把自己人拦在外面
    global-per-second: 8000
    # 缓存熔断时降到这个值：此时全部请求回源，MySQL 大约只扛得住 3500-4000/s。
    # 8000 的阈值在这时等于没设——保险丝必须跟着"下游此刻的承受力"走。
    degraded-global-per-second: 3500
    # 追踪的 IP 上限，防止攻击者用海量 IP 撑爆内存
    max-tracked-ips: 200000
  mq:
    namesrv: localhost:9876
    topic: shortlink_access
    producer-group: shortlink-producer
    consumer-group: shortlink-writer
  counters:
    # D5 的 HLL / 计数实例（noeviction），和缓存实例是两个不同语义的 Redis
    host: localhost
    port: 6380
  retention:
    # D4：明细保留 3 天
    access-log-days: 3    # 墓碑保留 90 天；超过之后该短码从 410 变成 404（写进验收说明）
    tombstone-days: 90
    # D7：限速参数。每批 1000 行、批间停 50ms ≈ 每小时最多 7200 万行，
    # 实际受 IO 限制远低于此，关键是"不要一口气删完"
    batch-size: 1000
    pause-ms: 50
  stats:
    # 生产必须 true。false 只用于压测 A/B 归因（关掉统计事件发送）。
    enabled: true
    consumer-enabled: true
    enqueue-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 关键：默认会聚合 db、redis、diskSpace。Redis 一挂整体就 DOWN——
      # 但我们的降级设计是"Redis 挂了照样服务"，两者自相矛盾。
      # 加了 autoheal 或编排层之后，会把一个正在正常工作的服务杀掉。
      #
      # 所以：只有"不能服务主功能"的组件才该进 readiness。
      #   - db：没有它，创建和冷码全废 → 进
      #   - redis / counters：挂了只降级，不影响 302 → 不进
      group:
        liveness:
          include: ping
        readiness:
          include: db,diskSpace
      show-details: never

logging:
  level:
    root: info
    dev.shortlink: info
